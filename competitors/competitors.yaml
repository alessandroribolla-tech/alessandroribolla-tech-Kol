# Registro concorrenti monitorati dall'agente monitor-concorrenza.
# Organizzato per gruppo societario e area geografica.
#
# tier 1 = monitoraggio settimanale completo (concorrenti diretti sul mercato italiano o Swiss made)
# tier 2 = monitoraggio settimanale sintetico (gruppi globali e brand con presenza in Italia)
# tier 3 = monitoraggio mensile (osservati: mercati esteri, low cost, biomateriali)
# origine: utente = indicato dalla direzione | agente = proposto dagli agenti, da confermare
# verificato: false = URL/handle da confermare al primo run; l'agente aggiorna il file.
# Per aggiungere: /nuovo-competitor <nome>

meta:
  aggiornato: 2026-11-22
  cadenza: settimanale
  fonti_settore:
    - { nome: Odontoiatria33, url: https://www.odontoiatria33.it/aziende/ }
    - { nome: Infodent, url: https://www.infodent.it/aziende }
    - { nome: Dental Tribune Italia, url: https://it.dental-tribune.com/news/ }
    - { nome: Dental Tribune International, url: https://www.dental-tribune.com/news/ }
    - { nome: Implant Book (Infodent), url: https://implant-book.com/ }
    - { nome: Il Dentista Moderno, url: https://www.ildentistamoderno.com/ }
    - { nome: Dentaljournal, url: https://www.dentaljournal.it/ }
    - { nome: ZWP online (DE), url: https://www.zwp-online.info/ }
    - { nome: Dentistry Today (US), url: https://www.dentistrytoday.com/ }
  eventi_da_seguire:
    - Expodental Meeting (Rimini, maggio)
    - IDS Colonia (marzo, anni impari)
    - AEEDC Dubai (febbraio)
    - EuroPerio, EAO, ITI World Symposium, Osteology
    - Congressi SIdP, SIO, SICOI, AIOP, Colloquium Dental
    - Dentsply Sirona World, Straumann Group events, Nobel Biocare Global Symposium

